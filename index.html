<body>
  <a id="skipToMain" class="skip-link" href="#/home">본문으로 건너뛰기</a>
  <div id="app"><div class="boot-screen"><div class="spinner"></div><p>LLM Bible을 불러오는 중입니다.</p></div></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script>
    window.__LLM_BIBLE_BOOTED__ = false;
    window.addEventListener('error', (event) => {
      const app = document.getElementById('app');
      if (!window.__LLM_BIBLE_BOOTED__ && app) {
        const message = event?.message || '정적 자산을 불러오지 못했습니다.';
        app.innerHTML = `<main style="max-width:860px;margin:48px auto;padding:24px;font-family:system-ui,sans-serif"><h1>LLM Bible 로딩 오류</h1><p>페이지 파일은 배포되었지만 앱 JavaScript를 실행하지 못했습니다.</p><pre style="white-space:pre-wrap;background:#111827;color:#f9fafb;padding:16px;border-radius:12px">${String(message).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre><p>GitHub Actions의 최신 배포가 완료되었는지 확인한 뒤 새로고침해 주세요.</p></main>`;
      }
    }, true);
    setTimeout(() => {
      const app = document.getElementById('app');
      if (!window.__LLM_BIBLE_BOOTED__ && app && app.textContent.includes('불러오는 중')) {
        app.innerHTML = '<main style="max-width:860px;margin:48px auto;padding:24px;font-family:system-ui,sans-serif"><h1>LLM Bible 로딩 지연</h1><p>JavaScript 모듈이 실행되지 않았습니다. 브라우저 개발자도구 Console 또는 GitHub Actions 배포 로그를 확인해 주세요.</p></main>';
      }
    }, 8000);
  </script>
  <script type="module" src="./src/main.js?v=2.2.1"></script>
</body>
